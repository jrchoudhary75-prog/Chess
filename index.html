<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Arena</title>
  
  <!-- Firebase Auth Setup -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBYTo_Flsgdj_3ktQ3FB704xgbTSppLpt0",
      authDomain: "chess-arena-eb263.firebaseapp.com",
      projectId: "chess-arena-eb263",
      storageBucket: "chess-arena-eb263.firebasestorage.app",
      messagingSenderId: "735495318337",
      appId: "1:735495318337:web:0b1a3141c5b9d33b448fc0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Auto Login Check on Page Load
    document.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('chessUser');
      if (savedUser) {
        showMainApp(JSON.parse(savedUser));
      }
    });

    function showMainApp(user) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-avatar').src = user.profilePic || '';
      document.getElementById('user-display-name').innerText = user.name;
    }

    window.loginWithGoogle = async function() {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;
        
        const res = await fetch('/api/user/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            googleId: user.uid,
            name: user.displayName,
            email: user.email,
            profilePic: user.photoURL
          })
        });

        if (!res.ok) throw new Error("Backend Sync Failed");

        const dbUser = await res.json();
        // Browser me user save karein (Bar-bar login se bachne ke liye)
        localStorage.setItem('chessUser', JSON.stringify(dbUser));
        showMainApp(dbUser);
      } catch (error) {
        console.error("Login Error:", error);
        alert("Login failed: " + error.message);
      }
    };

    window.logoutUser = function() {
      localStorage.removeItem('chessUser');
      location.reload();
    };
  </script>
</head>
<body style="margin: 0; background-color: #161512; color: white; font-family: sans-serif;">

  <!-- 1. Google Login Screen (Pehle Dikhne Wali Screen) -->
  <div id="auth-screen" style="display: flex; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #121212; z-index: 9999; justify-content: center; align-items: center;">
    <div style="background: #262421; padding: 40px; border-radius: 12px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);">
      <h1 style="margin-bottom: 10px;">Chess Arena</h1>
      <p style="color: #bababa; margin-bottom: 25px;">Sign in to play online and challenge friends</p>
      <button onclick="loginWithGoogle()" style="padding: 12px 24px; background: #4285F4; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px;">
        Sign in with Google
      </button>
    </div>
  </div>

  <!-- 2. Main Game Area (Logn hone ke baad hi dikhegi) -->
  <div id="main-app" style="display: none;">
    <!-- Top Profile Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; background: #262421; padding: 10px 20px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <img id="user-avatar" src="" style="width: 35px; height: 35px; border-radius: 50%; border: 1px solid #81b64c;">
        <span id="user-display-name" style="font-weight: bold;"></span>
      </div>
      <button onclick="logoutUser()" style="background: #e53935; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Logout</button>
    </div>

    <!-- Aapka Purana Game Arena Code Yahan Rahega -->
    <!-- (Play with Bot, Play with Friend, Board UI etc.) -->
  </div>

</body>
</html>
